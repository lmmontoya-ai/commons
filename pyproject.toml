[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commons"
version = "0.1.0"
description = "Commons (Office): a three-agent shared-workplace environment with hidden objectives for language-model agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commons = ["data/*.json", "v1/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The classic ruff default rule set plus import sorting, pinned explicitly so
# results do not change with the ruff version.
select = ["E4", "E7", "E9", "F", "I"]
